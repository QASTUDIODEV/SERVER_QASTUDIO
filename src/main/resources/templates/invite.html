<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Team Project Invitation</title>
</head>
<body>
<div style="max-width: 600px; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); margin: auto;">
  <h2 style="color: #333;">Team Project Invitation</h2>
  <p style="color: #555; font-size: 16px;">Hello, QASTUDIO is here.</p>
  <p style="color: #555; font-size: 16px;">You have been invited to join the <strong style="color: #007bff;" th:text="${teamProjectName}">[Team Project Name]</strong> team!</p>
  <p style="color: #555; font-size: 16px;">Click the button below to accept the invitation and join the project.</p>
  <div style="text-align: center; margin: 20px 0;">
    <a th:href="${invitationLink}" style="background-color: #007bff; color: #ffffff; padding: 12px 20px; text-decoration: none; font-size: 16px; border-radius: 5px; display: inline-block;">Join Project</a>
  </div>
  <p style="color: #888; font-size: 14px;">This invitation is valid until <span th:text="${expirationDate}">[Expiration Date]</span>.</p>
</div>
</body>
</html>
